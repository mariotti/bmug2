name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # plocate provides the mlocate-style updatedb/locate dialect,
        # exercising the non-GNU branch of the capability detection;
        # zsh is needed for the _bmu completion file's syntax check
        # (macOS ships zsh by default, Ubuntu doesn't); rclone exercises
        # backmeup.replicate.sh for real
        run: sudo apt-get update && sudo apt-get install -y rsync plocate zsh rclone
      - name: Run test suite
        run: sh tests/test_backmeup.sh

  linux-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync plocate zsh rclone
      - name: Install bashcov
        # Ruby is pre-installed on ubuntu-latest; no apt step needed.
        run: gem install bashcov --no-document
      - name: Run test suite with coverage
        # bashcov instruments bash scripts via the DEBUG trap. The bin/*.sh
        # scripts use #!/bin/sh, which on Ubuntu 24.04 is dash — not
        # traceable by bashcov. Redirecting /bin/sh → bash for this job
        # makes all #!/bin/sh subprocesses run under bash so they are
        # instrumented. The correctness test (linux job above) still runs
        # under real sh/dash; this job measures coverage only.
        # .simplecov filters to bin/ so shunit2 and the test harness are
        # excluded from the percentage.
        run: |
          sudo ln -sf /usr/bin/bash /bin/sh
          cat > .simplecov << 'EOF'
          SimpleCov.configure do
            add_filter { |f| !f.filename.include?('/bin/') }
          end
          EOF
          bashcov -- bash tests/test_backmeup.sh
      - name: Update shell coverage badge
        # Only update the badge on pushes to main — GITHUB_TOKEN is
        # read-only on fork PRs, and we only want the badge to reflect
        # the latest merged state.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PCT=$(jq -r '.result.line | floor' coverage/.last_run.json)
          if [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 70 ]; then COLOR="green"
          elif [ "$PCT" -ge 50 ]; then COLOR="yellow"
          else COLOR="red"; fi
          JSON=$(printf '{"schemaVersion":1,"label":"shell","message":"%s%%","color":"%s"}' "$PCT" "$COLOR")
          CONTENT=$(printf '%s\n' "$JSON" | base64 -w0)
          SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/shell-coverage.json?ref=badges" \
            --jq .sha 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/shell-coverage.json" \
              --field message="ci: update shell coverage [skip ci]" \
              --field branch=badges \
              --field content="$CONTENT" \
              --field sha="$SHA"
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/shell-coverage.json" \
              --field message="ci: update shell coverage [skip ci]" \
              --field branch=badges \
              --field content="$CONTENT"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # real rsync (Apple ships openrsync), GNU findutils
        # (gupdatedb/glocate), and rclone for backmeup.replicate.sh
        run: brew install rsync findutils rclone
      - name: Run test suite
        run: sh tests/test_backmeup.sh

  mcp-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync plocate
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        run: pytest mcp/tests --cov=bmug2_mcp --cov-report=xml
      - name: Upload coverage to Codecov
        # Codecov's own upload hiccups shouldn't fail this job - pytest's
        # exit code above is what actually gates CI.
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  mcp-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: brew install rsync findutils
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        run: pytest mcp/tests --cov=bmug2_mcp --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install Tauri Linux build dependencies
        # webkit2gtk/gtk/appindicator/rsvg headers + patchelf, per Tauri's
        # own Ubuntu prerequisite list - needed even just to compile the
        # crate (it links against these), not only to bundle an installer.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        working-directory: gui
        run: npm test -- --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        working-directory: gui/src-tauri
        # cargo-llvm-cov wraps cargo test itself - this replaces the
        # plain `cargo test` run, not a second pass over the suite.
        # --test-threads=1: replication.rs's sandbox()/fake_configure_script()
        # test helpers write a small shell script, chmod it executable, then
        # immediately exec it, with no synchronization against any other test
        # doing the same thing concurrently - a real ETXTBSY ("Text file busy")
        # race under cargo test's default parallel threads, confirmed flaky in
        # CI (passed in a duplicate parallel run of the identical commit,
        # failed in a different replication:: test each time). Serializing the
        # whole suite is the simple fix; this binary's tests are fast enough
        # (well under a minute total) that losing parallelism here is cheap
        # compared to chasing a non-deterministic failure.
        run: cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false

  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install dependencies
        # Same reason as the macos job above: Apple ships openrsync as
        # /usr/bin/rsync, which the real end-to-end test's backmeup.sh
        # call refuses to use (it drops --delete with --backup) - without
        # a real rsync on PATH that test fails with no usable rsync found.
        run: brew install rsync findutils
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        working-directory: gui
        run: npm test -- --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        working-directory: gui/src-tauri
        # See the gui-linux job's own comment on this same flag - same
        # unsynchronized write+chmod+exec race in replication.rs's test
        # helpers, same fix. cargo-llvm-cov wraps cargo test itself.
        run: cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false
