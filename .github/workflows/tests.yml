name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run test suite with coverage (kcov)
        id: shell_coverage
        # kcov measures coverage for the shell engine (bin/) - it's
        # ptrace-based, Linux-only, which is why this runs only here
        # and not in the macos job below. It's not in Ubuntu 24.04's
        # (noble) apt archive (confirmed via Launchpad - only landed in
        # much newer dev releases), so this uses kcov's own official
        # Debian-based Docker image instead of apt or a from-source
        # build. Running the whole invocation inside that container
        # (re-installing the same 3 test-runtime deps there) avoids any
        # host/container glibc mismatch from extracting just the
        # binary. v42 - the newest versioned tag Docker Hub actually
        # has - turned out to be a dead end for real (confirmed in
        # this PR's own earlier CI runs): it's a 2023-era Debian 11
        # build whose debian-security pool has since moved point
        # releases out from under it, 404ing on `apt-get install`.
        # kcov/kcov:latest-alpine is rebuilt often (last rebuilt
        # 2026-04-02, per Docker Hub's API) and Alpine's rolling apk
        # index doesn't have that failure mode - so this uses it
        # un-pinned, the one real exception to pinning everything else
        # in this file to an exact version.
        #
        # Installed inside the container: plocate (the mlocate-style
        # updatedb/locate dialect, exercising the non-GNU branch of the
        # capability detection), zsh (the _bmu completion file's syntax
        # check - macOS ships zsh by default, Ubuntu doesn't), rclone
        # (exercises backmeup.replicate.sh for real) - the same 3
        # reasons the old host-level install had, just moved here now
        # that the suite runs inside this container instead.
        #
        # kcov traces the whole process tree it launches, so every
        # bin/*.sh script the suite execs as its own subprocess gets
        # instrumented too, not just the top-level `sh` invocation.
        # --include-path scopes the report to the actual engine code,
        # excluding tests/ and the bundled shunit2. The exact output
        # layout isn't documented precisely enough to hardcode, so
        # this finds whatever cobertura.xml kcov produced rather than
        # guessing a path - and the upload step below no-ops instead
        # of failing CI if that search comes up empty.
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$(pwd)":/code -w /code \
            kcov/kcov:latest-alpine \
            sh -c "apk add --no-cache rsync plocate zsh rclone >/dev/null && kcov --include-path=/code/bin /code/kcov-out sh tests/test_backmeup.sh"
          report=$(find kcov-out -name cobertura.xml | head -1)
          echo "coverage report: ${report:-<none found>}"
          echo "report=$report" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        if: steps.shell_coverage.outputs.report != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.shell_coverage.outputs.report }}
          flags: shell
          fail_ci_if_error: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # real rsync (Apple ships openrsync), GNU findutils
        # (gupdatedb/glocate), and rclone for backmeup.replicate.sh
        run: brew install rsync findutils rclone
      - name: Run test suite
        run: sh tests/test_backmeup.sh

  mcp-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync plocate
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        run: pytest mcp/tests --cov=bmug2_mcp --cov-report=xml
      - name: Upload coverage to Codecov
        # Codecov's own upload hiccups shouldn't fail this job - pytest's
        # exit code above is what actually gates CI.
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  mcp-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: brew install rsync findutils
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        run: pytest mcp/tests --cov=bmug2_mcp --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install Tauri Linux build dependencies
        # webkit2gtk/gtk/appindicator/rsvg headers + patchelf, per Tauri's
        # own Ubuntu prerequisite list - needed even just to compile the
        # crate (it links against these), not only to bundle an installer.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        working-directory: gui
        run: npm test -- --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        working-directory: gui/src-tauri
        # cargo-llvm-cov wraps cargo test itself - this replaces the
        # plain `cargo test` run, not a second pass over the suite.
        # --test-threads=1: replication.rs's sandbox()/fake_configure_script()
        # test helpers write a small shell script, chmod it executable, then
        # immediately exec it, with no synchronization against any other test
        # doing the same thing concurrently - a real ETXTBSY ("Text file busy")
        # race under cargo test's default parallel threads, confirmed flaky in
        # CI (passed in a duplicate parallel run of the identical commit,
        # failed in a different replication:: test each time). Serializing the
        # whole suite is the simple fix; this binary's tests are fast enough
        # (well under a minute total) that losing parallelism here is cheap
        # compared to chasing a non-deterministic failure.
        run: cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false

  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install dependencies
        # Same reason as the macos job above: Apple ships openrsync as
        # /usr/bin/rsync, which the real end-to-end test's backmeup.sh
        # call refuses to use (it drops --delete with --backup) - without
        # a real rsync on PATH that test fails with no usable rsync found.
        run: brew install rsync findutils
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        working-directory: gui
        run: npm test -- --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        working-directory: gui/src-tauri
        # See the gui-linux job's own comment on this same flag - same
        # unsynchronized write+chmod+exec race in replication.rs's test
        # helpers, same fix. cargo-llvm-cov wraps cargo test itself.
        run: cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false
