name: tests

on:
  # `push: branches: [main]` restricts the push trigger to post-merge
  # runs on main (keeping the update-test-count-badge aggregator fed,
  # which only runs on push-to-main), while `pull_request:` covers
  # every PR once. Before this restriction, every branch push also
  # fired `push`, so PRs ran CI TWICE for the same commit (visible as
  # 12 rows in `gh pr checks` for 6 real jobs).
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    # Exposed for the update-test-count-badge aggregator below. Only
    # the linux variant exports a count (not macos) - the two suites
    # should run the same tests, so sampling one is enough; and the
    # aggregator just needs one number per language, not two.
    outputs:
      count: ${{ steps.test-suite.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # plocate provides the mlocate-style updatedb/locate dialect,
        # exercising the non-GNU branch of the capability detection;
        # zsh is needed for the _bmu completion file's syntax check
        # (macOS ships zsh by default, Ubuntu doesn't); rclone exercises
        # backmeup.replicate.sh for real
        run: sudo apt-get update && sudo apt-get install -y rsync plocate zsh rclone
      - name: Run test suite
        id: test-suite
        # tee for the badge-count parse below; pipefail is on by default
        # in bash-shell steps, so the suite's exit code still gates the
        # job (tee's own exit code doesn't shadow it). sed strips ANSI
        # color codes before parsing - CI tools emit them even when piped
        # (GitHub Actions forces color via FORCE_COLOR/CARGO_TERM_COLOR),
        # which broke the first version of this parser (confirmed in run
        # 40590411460's gui-linux failure).
        run: |
          sh tests/test_backmeup.sh | tee /tmp/shell-output.log
          count=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/shell-output.log | grep -oE "^Ran [0-9]+ tests" | awk '{print $2}')
          [ -n "$count" ] || { echo "Failed to parse shell test count"; exit 1; }
          echo "count=$count" >> "$GITHUB_OUTPUT"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # real rsync (Apple ships openrsync), GNU findutils
        # (gupdatedb/glocate), and rclone for backmeup.replicate.sh
        run: brew install rsync findutils rclone
      - name: Run test suite
        run: sh tests/test_backmeup.sh

  mcp-linux:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.test-suite.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync plocate
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        id: test-suite
        run: |
          pytest mcp/tests --cov=bmug2_mcp --cov-report=xml | tee /tmp/pytest-output.log
          # pytest prints "N passed in X.XXs" on the final summary line.
          # sed strips ANSI codes - see the shell test suite's own comment
          # above on why that's needed in CI.
          count=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/pytest-output.log | grep -oE "[0-9]+ passed in" | tail -1 | awk '{print $1}')
          [ -n "$count" ] || { echo "Failed to parse pytest count"; exit 1; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        # Codecov's own upload hiccups shouldn't fail this job - pytest's
        # exit code above is what actually gates CI.
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  mcp-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: brew install rsync findutils
      - name: Install bmug2-mcp
        run: pip install -e "./mcp[dev]"
      - name: Run test suite
        run: pytest mcp/tests --cov=bmug2_mcp --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  gui-linux:
    runs-on: ubuntu-latest
    outputs:
      ts_count: ${{ steps.ts-tests.outputs.count }}
      rust_count: ${{ steps.rust-tests.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # clippy here so the warnings-as-errors step below can run on
          # the CI toolchain (not on whatever each dev happens to have
          # locally); CLAUDE.md's safety-boundaries section calls out
          # that any warning is in-scope for the current PR, and this
          # is how CI actually enforces that for the Rust side.
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install Tauri Linux build dependencies
        # webkit2gtk/gtk/appindicator/rsvg headers + patchelf, per Tauri's
        # own Ubuntu prerequisite list - needed even just to compile the
        # crate (it links against these), not only to bundle an installer.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev
      - name: Rust lint (clippy, warnings-as-errors)
        # `-D warnings` promotes every clippy lint AND every rustc
        # warning (clippy wraps rustc) to a hard failure, so a new
        # unused import, deprecated-API call, or clippy nit all fail
        # CI instead of just showing in the log. `--all-targets`
        # covers lib + tests + examples - a warning in a test file
        # counts just as much as one in src/.
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        id: ts-tests
        working-directory: gui
        run: |
          npm test -- --coverage --coverage.reporter=lcov | tee /tmp/vitest-output.log
          # vitest prints "Tests  N passed (N)" on its summary line, but
          # emits ANSI color codes BETWEEN "Tests" and the digit in CI
          # (GitHub Actions forces color output even when piped) which
          # broke the first parser - strip them first.
          count=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/vitest-output.log | grep -oE "Tests[[:space:]]+[0-9]+ passed" | awk '{print $2}')
          [ -n "$count" ] || { echo "Failed to parse vitest count"; exit 1; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        id: rust-tests
        working-directory: gui/src-tauri
        # cargo-llvm-cov wraps cargo test itself - this replaces the
        # plain `cargo test` run, not a second pass over the suite.
        # --test-threads=1: replication.rs's sandbox()/fake_configure_script()
        # test helpers write a small shell script, chmod it executable, then
        # immediately exec it, with no synchronization against any other test
        # doing the same thing concurrently - a real ETXTBSY ("Text file busy")
        # race under cargo test's default parallel threads, confirmed flaky in
        # CI (passed in a duplicate parallel run of the identical commit,
        # failed in a different replication:: test each time). Serializing the
        # whole suite is the simple fix; this binary's tests are fast enough
        # (well under a minute total) that losing parallelism here is cheap
        # compared to chasing a non-deterministic failure.
        run: |
          cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1 | tee /tmp/cargo-output.log
          # cargo prints "test result: ok. N passed; ..." once per test
          # binary (lib, main, doc-tests) - sum them for the real total.
          # sed strips ANSI codes (CARGO_TERM_COLOR=always in CI emits
          # them even when piped) - see vitest step above for the same
          # issue that bit the first version of this.
          count=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/cargo-output.log | grep -oE "test result: ok\. [0-9]+ passed" | awk '{sum+=$4} END{print sum}')
          [ -n "$count" ] && [ "$count" != "0" ] || { echo "Failed to parse cargo test count"; exit 1; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false

  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # jsdom (added for the frontend unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 - confirmed the
          # previous pin (20) doesn't satisfy any of those ranges at
          # all, not just "an old jsdom". lts/* stays valid as Node's
          # own LTS line advances, rather than going stale again later.
          node-version: "lts/*"
      - name: Install dependencies
        # Same reason as the macos job above: Apple ships openrsync as
        # /usr/bin/rsync, which the real end-to-end test's backmeup.sh
        # call refuses to use (it drops --delete with --backup) - without
        # a real rsync on PATH that test fails with no usable rsync found.
        run: brew install rsync findutils
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Type-check and build frontend
        working-directory: gui
        run: npm run build
      - name: Run frontend unit tests with coverage
        working-directory: gui
        run: npm test -- --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Run Rust test suite with coverage
        working-directory: gui/src-tauri
        # See the gui-linux job's own comment on this same flag - same
        # unsynchronized write+chmod+exec race in replication.rs's test
        # helpers, same fix. cargo-llvm-cov wraps cargo test itself.
        run: cargo llvm-cov --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gui/src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false

  # Sums the four CI suites' real test counts and force-pushes a single
  # orphan commit to the `badges` branch with a shields.io endpoint-badge
  # JSON. Runs only on push-to-main so PR branches don't flap the badge;
  # README.md's `tests` badge reads directly from this branch's raw URL.
  # Force-push keeps the branch at one commit forever (shields.io reads
  # the tip; past counts aren't meaningful on their own).
  update-test-count-badge:
    needs: [linux, mcp-linux, gui-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute total and push badge JSON
        env:
          SHELL_COUNT: ${{ needs.linux.outputs.count }}
          PYTHON_COUNT: ${{ needs.mcp-linux.outputs.count }}
          TS_COUNT: ${{ needs.gui-linux.outputs.ts_count }}
          RUST_COUNT: ${{ needs.gui-linux.outputs.rust_count }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          for v in SHELL_COUNT PYTHON_COUNT TS_COUNT RUST_COUNT; do
            if [ -z "${!v}" ]; then
              echo "$v is empty - aborting rather than publishing a wrong total" >&2
              exit 1
            fi
          done
          TOTAL=$((SHELL_COUNT + PYTHON_COUNT + TS_COUNT + RUST_COUNT))
          BADGE_JSON="{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${TOTAL} passing\",\"color\":\"brightgreen\"}"
          echo "Publishing: $BADGE_JSON"

          work=$(mktemp -d)
          cd "$work"
          echo "$BADGE_JSON" > test-count.json
          git init -q -b badges
          git -c user.email="noreply@github.com" -c user.name="bmug2 badge updater" add test-count.json
          git -c user.email="noreply@github.com" -c user.name="bmug2 badge updater" \
            commit -q -m "update test count: ${TOTAL} (shell:${SHELL_COUNT}, python:${PYTHON_COUNT}, rust:${RUST_COUNT}, ts:${TS_COUNT})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -f origin badges
