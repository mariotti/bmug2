name: gui-release

# Builds installer bundles for the desktop GUI whenever a version tag is
# pushed (the same v* tags the CLI's own releases use), and exposes them
# as downloadable workflow artifacts - not auto-attached to the matching
# GitHub Release, since that's cut by hand shortly after tagging and the
# ordering between the two isn't guaranteed. Attach manually once both
# exist:
#   gh run download <run-id> --dir /tmp/release-X.Y.Z
#   gh release upload vX.Y.Z /tmp/release-X.Y.Z/**/*.{dmg,AppImage,deb,rpm}
#
# The three Linux variants (x86_64 and aarch64 bundles, plus the single
# macOS .dmg) ship:
#   - .dmg       macOS (arm64 — Apple Silicon)
#   - .deb       Debian/Ubuntu x86_64 + aarch64
#   - .AppImage  distro-agnostic Linux x86_64 + aarch64
#   - .rpm       Fedora/RHEL/CentOS Stream/Rocky/Alma x86_64 + aarch64
#                (GPG-signed; public key at docs/bmug2-releases.asc)
#
# The .rpm artifacts are signed with the repo's release key, using the
# GPG_PRIVATE_KEY / GPG_PASSPHRASE / GPG_KEY_ID secrets. Users verify
# with:
#   sudo rpm --import https://raw.githubusercontent.com/mariotti/bmug2/main/docs/bmug2-releases.asc
#   rpm --checksig bmug2_*.rpm      # expect "digests signatures OK"
# .deb and .AppImage are NOT signed by this workflow - Debian-side
# signing is a separate flow (dpkg-sig / debsigs + repo metadata) and
# AppImage signing uses a different embedded-signature format; neither
# is set up yet.
#
# IMPORTANT: the macOS app is ad-hoc signed (tauri.conf.json's
# bundle.macOS.signingIdentity: "-") but not notarized - a real
# Developer ID certificate needs the repository owner's own paid
# developer account, not set up here. Ad-hoc signing isn't optional
# polish: without it, the assembled .app has no CodeResources seal at
# all and macOS refuses to open it with "the app is damaged and
# should be moved to the Trash" - confirmed for real via `spctl -a
# -vvv --type execute` against an unsigned build, not just theorized.
# With ad-hoc signing in place, a fresh download instead shows the
# normal, recoverable Gatekeeper prompt for an unnotarized app -
# right-click > Open, or System Settings > Privacy & Security > Open
# Anyway.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          # lts/* rather than a pinned major, matching tests.yml's own
          # fix for the same reason: Node 20 is being phased out of
          # GitHub-hosted tooling, and pinning a specific old major
          # just goes stale again later.
          node-version: "lts/*"
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri bundles
        working-directory: gui
        run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: bmug2-macos-bundle
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    # x86_64 and aarch64 share the same step list (same Ubuntu base,
    # same Tauri build command, same signing) so one matrix definition
    # is cleaner than two near-duplicate jobs. ubuntu-24.04-arm became
    # a GA GitHub-hosted runner for public repos in Jan 2025 - no
    # cross-compilation needed, each build runs natively on its own
    # architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          # lts/* rather than a pinned major, matching tests.yml's own
          # fix for the same reason: Node 20 is being phased out of
          # GitHub-hosted tooling, and pinning a specific old major
          # just goes stale again later.
          node-version: "lts/*"
      - name: Install Tauri Linux build dependencies
        # `rpm` was added so Tauri's `bundle.targets: "all"` actually
        # produces a .rpm - without the rpm CLI on PATH it silently
        # skips that target, which is how we shipped v2.18.9/v2.18.11
        # with .deb + .AppImage but no .rpm despite the config asking
        # for all three.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev \
            rpm
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri bundles
        working-directory: gui
        run: npm run tauri build
      - name: Import GPG signing key
        # Imports the private key into the runner's keyring and
        # pre-caches the passphrase into gpg-agent (loopback pinentry)
        # so the subsequent `rpm --addsign` can sign non-interactively.
        # v6 targeted Node 20 (deprecated by GHA Oct 2025, auto-promoted
        # to Node 24 with a warning); v7 targets Node 24 natively.
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign RPM
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        # rpm --addsign shells out to gpg via %__gpg_sign_cmd; a tiny
        # wrapper script injects --pinentry-mode loopback and the
        # passphrase from env so gpg doesn't block for a tty prompt.
        # Keeping the passphrase in a step env + wrapper (not in
        # ~/.rpmmacros on disk) means it never persists to a file.
        run: |
          mkdir -p "$HOME/.gpg-wrapper"
          cat > "$HOME/.gpg-wrapper/gpg-sign-wrapper" <<'WRAPPER'
          #!/bin/bash
          exec gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
          WRAPPER
          chmod +x "$HOME/.gpg-wrapper/gpg-sign-wrapper"
          cat > "$HOME/.rpmmacros" <<MACROS
          %_signature gpg
          %_gpg_name ${GPG_KEY_ID}
          %__gpg_sign_cmd $HOME/.gpg-wrapper/gpg-sign-wrapper --no-armor --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          MACROS
          shopt -s nullglob
          rpms=(gui/src-tauri/target/release/bundle/rpm/*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "No RPMs found to sign - did the Tauri build skip the rpm bundle target?" >&2
            exit 1
          fi
          for rpm in "${rpms[@]}"; do
            echo "Signing $rpm"
            rpm --addsign "$rpm"
          done
          # rpm --checksig has its own trust db separate from gpg's,
          # so the signer's public key must also be imported there.
          # Importing from the committed docs/bmug2-releases.asc file
          # (rather than re-exporting from the gpg keyring) doubles as
          # a drift check: if GPG_PRIVATE_KEY is ever rotated without
          # updating the committed public key, --checksig below fails
          # and so does the build.
          sudo rpm --import docs/bmug2-releases.asc
          echo "=== Keys in rpm trust db (sudo view) ==="
          sudo rpm -qa 'gpg-pubkey*' || true
          echo "=== Keys in rpm trust db (user view) ==="
          rpm -qa 'gpg-pubkey*' || true
          echo "=== GPG signing-keyring fingerprint ==="
          gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10}'
          echo "=== docs/bmug2-releases.asc fingerprint ==="
          gpg --show-keys --with-colons docs/bmug2-releases.asc | awk -F: '/^fpr/{print $10}'
          for rpm in "${rpms[@]}"; do
            echo "=== rpm --checksig --verbose for $rpm ==="
            rpm --checksig --verbose "$rpm" || echo "(checksig exit $?)"
          done
          # Final gate (unchanged): fail the job if ANY rpm fails checksig.
          for rpm in "${rpms[@]}"; do
            rpm --checksig "$rpm"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bmug2-linux-${{ matrix.arch }}-bundles
          path: |
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
