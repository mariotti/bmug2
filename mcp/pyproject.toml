[project]
name = "bmug2-mcp"
version = "0.1.0"
description = "MCP server exposing bmug2 (backup/search/archive) as tools for an LLM assistant"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2",
]

[project.scripts]
bmug2-mcp = "bmug2_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmug2_mcp"]
