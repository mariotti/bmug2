[package]
name = "exif-scan"
version = "0.1.0"
edition = "2021"
publish = false
description = "bmug2 photo-exit: read-only EXIF scanner. Walks a directory, emits one JSON line per photo to stdout."

[[bin]]
name = "bmug2-exif-scan"
path = "src/main.rs"

[lib]
name = "exif_scan"
path = "src/lib.rs"

[dependencies]
kamadak-exif = "0.6"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
